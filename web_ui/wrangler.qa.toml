# QA only. Serves the built web_ui at https://stock.qa.ryanxu.dev from a
# static-assets Worker. Production stays on the finance-web-ui Pages project.
# Build first with VITE_API_BASE_URL pointing at the finance-api-qa Worker.
name = "finance-web-ui-qa"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[routes]]
pattern = "stock.qa.ryanxu.dev"
custom_domain = true
