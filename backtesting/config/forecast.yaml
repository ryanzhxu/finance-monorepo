model_version: forecast_baseline
horizon_sessions: 63
upside_return_threshold: 0.2
downside_drawdown_threshold: -0.2
bucket_count: 5
minimum_observations: 100
minimum_folds: 3
minimum_brier_improvement: 0.001
position_sizing:
  allocations:
    small_bet: 0.005
    starter_bet: 0.01
    larger_bet: 0.02
  larger_bet_upside_probability: 0.35
  small_bet_downside_probability: 0.45
