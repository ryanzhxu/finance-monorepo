name: CI

# Runs on every pull request and on pushes to main. This is the check the
# branch ruleset requires, so a pull request cannot merge until it is green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The required status-check context is this JOB name, not the workflow name.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Python tests
        run: uv run pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker tests
        working-directory: cloudflare-api
        run: npm test

      - name: Frontend install
        working-directory: web_ui
        run: npm ci

      - name: Frontend locale checks
        working-directory: web_ui
        run: npm test

      - name: Frontend build
        working-directory: web_ui
        run: npm run build
