name: Deploy

# Merging to main deploys. The tests run again here against the merged tree,
# because a pull request is green against its own head and can still break the
# branch when it lands beside another one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  # Queue deploys rather than cancelling. A cancelled deploy can strand an
  # older build as the live one.
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Python tests
        run: uv run pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker tests
        working-directory: cloudflare-api
        run: npm test

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloudflare-api
        run: npx --yes wrangler@4 deploy

      - name: Skip Worker deploy (no token configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Worker deploy skipped::CLOUDFLARE_API_TOKEN is not set in repository secrets."

  # web_ui used to reach production through the Cloudflare Pages GitHub
  # integration. That integration is disconnected — `wrangler pages project
  # list` reports Git Provider: No for finance-web-ui — so nothing had shipped
  # the frontend since 2026-07-24. Deploying from CI puts it back under the
  # repo's control and does not depend on the integration being reconnected.
  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web_ui
        run: npm ci

      # Vite reads web_ui/.env.production automatically in production mode, so
      # the bundle points at the deployed Worker rather than localhost.
      - name: Build frontend
        working-directory: web_ui
        run: npm run build

      - name: Deploy Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web_ui
        run: npx --yes wrangler@4 pages deploy dist --project-name=finance-web-ui --branch=main

      - name: Skip Pages deploy (no token configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Pages deploy skipped::CLOUDFLARE_API_TOKEN is not set in repository secrets."
