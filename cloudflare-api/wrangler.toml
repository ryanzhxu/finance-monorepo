name = "finance-api"
main = "src/index.js"
compatibility_date = "2026-06-27"
workers_dev = true

[vars]
# Vincent's decision engine owns the technical layer (decided 2026-08-28).
# The client appends /decision/<SYMBOL>?horizon=<h>, so this points at the
# Worker's /api prefix. Unset it to fall back to the local technicals.
TECHNICAL_ENGINE_BASE_URL = "https://decision-v1.rxlab.workers.dev/api"
TECHNICAL_ENGINE_TIMEOUT = "8"
SHARED_WATCHLIST_SLUG = "drama"
SHARED_WATCHLIST_DISPLAY_NAME = "Drama"
RESEARCH_ENABLED = "false"
RESEARCH_DECISION_SUPPORT_ENABLED = "false"
RESEARCH_MODEL_STATUS = "configured"
CURSOR_RESEARCH_DISCOVERY_MODEL = "claude-sonnet-5"
CURSOR_RESEARCH_VERIFICATION_MODEL = "claude-haiku-4-5"
CURSOR_RESEARCH_REVIEW_MODEL = "claude-haiku-4-5"

[durable_objects]
bindings = [
  { name = "SHARED_WATCHLIST_SPACE", class_name = "SharedWatchlistSpace" },
  { name = "RESEARCH_JOBS", class_name = "ResearchJob" },
  { name = "RESEARCH_RATE_LIMITER", class_name = "ResearchRateLimiter" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SharedWatchlistSpace"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ResearchJob", "ResearchRateLimiter"]
